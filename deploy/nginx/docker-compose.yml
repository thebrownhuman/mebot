# ADVANCED: nginx serves the static UI and proxies the backend (the pre-0.9 layout).
# Most installs should use the single image in ../../docker-compose.yml instead.
# Run from this directory: docker compose up -d --build
services:
  backend:
    # The single image; nginx in front only adds static hosting.
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      # reach Ollama running on the HOST machine (not in a container)
      - OLLAMA_HOST=http://host.docker.internal:11434
      - CORS_ORIGINS=http://localhost:8080
      # nginx (frontend container) is the proxy: use its X-Forwarded-* headers so login
      # rate limits apply per client, not to the nginx container's IP.
      - TRUST_PROXY=true
    volumes:
      # persist the sqlite db on the host so data survives container restarts
      - ./data:/data
    extra_hosts:
      # makes host.docker.internal work on Linux (built-in on Mac/Windows)
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  frontend:
    build:
      context: ../..
      dockerfile: deploy/nginx/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
