server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app may only be framed by itself. The embed page (/embed/…, from the backend)
    # sets its own frame-ancestors from the owner's allowed sites instead.
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        # SPA: serve index.html for any non-file route
        try_files $uri $uri/ /index.html;
    }

    # Widget loader: versioned path, safe to cache for a day.
    location /widget/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Embed bundle entry (fixed name, so always revalidate); its chunks live in /assets/.
    location /embed-app/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Backend-rendered pages: the embed page (per-site CSP), loader alias, test page.
    location ~ ^/(embed/|widget\.js$|widget-test$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API to the backend container. "backend" is the compose service name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming: don't buffer the token-by-token chat response
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
