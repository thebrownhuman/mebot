name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_version.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check mebot tests migrations
      - run: ruff format --check mebot tests migrations
      - name: docs/configuration.md is up to date
        run: python -m mebot.config --markdown | diff -u ../docs/configuration.md -
      # Random order + parallel workers, and no reruns: a flaky test fails the build.
      - run: python -m pytest -q -n auto -p randomly --durations=15

  # Hosted mode runs on Postgres: the whole backend suite again, against a real server.
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mebot
          POSTGRES_PASSWORD: mebot
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mebot" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MEBOT_TEST_POSTGRES: postgresql+psycopg://mebot:mebot@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -n 4 -p randomly --durations=15

  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: registry/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Only production deps gate the build; dev-tool advisories don't ship.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build mebot image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mebot:ci
          cache-from: type=gha,scope=mebot
          cache-to: type=gha,mode=max,scope=mebot
      - name: Image size (target <= 250 MB)
        run: docker image inspect mebot:ci --format '{{.Size}}' | awk '{ printf "%.1f MB\n", $1/1048576 }'
      - run: bash scripts/smoke.sh mebot:ci
      - name: Build registry image
        uses: docker/build-push-action@v6
        with:
          context: registry
          load: true
          tags: mebot-registry:ci
          cache-from: type=gha,scope=registry
          cache-to: type=gha,mode=max,scope=registry
      - run: bash scripts/smoke-registry.sh mebot-registry:ci
