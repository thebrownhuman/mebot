# Publishes packages/sdk to npm when a tag sdk-vX.Y.Z is pushed. Nothing is published
# until the maintainer sets the real package name (package.json "name", currently the
# placeholder @npm-scope/mebot), adds the NPM_TOKEN secret and pushes such a tag.
name: SDK publish

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - name: Tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          test "sdk-v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != sdk-v$v"; exit 1; }
      - name: Refuse the placeholder package name
        run: |
          n="$(node -p "require('./package.json').name")"
          case "$n" in @npm-scope/*) echo "set the real npm name first ($n)"; exit 1;; esac
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
