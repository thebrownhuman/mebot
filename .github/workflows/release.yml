name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # GitHub Release
  packages: write   # GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches backend and frontend versions
        id: version
        run: echo "version=$(python3 scripts/check_version.py "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ steps.version.outputs.version }}"
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: mebot image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/mebot:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.owner }}/mebot:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: registry image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: registry
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/mebot-registry:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.owner }}/mebot-registry:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "mebot ${{ steps.version.outputs.version }}" --notes-file notes.md
