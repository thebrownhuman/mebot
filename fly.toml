# fly launch --no-deploy --copy-config ; fly volumes create mebot_data --size 1 ; fly deploy
app = "mebot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  COOKIE_SECURE = "true"
  TRUST_PROXY = "true"
  # PUBLIC_URL = "https://mebot.fly.dev"
  # CORS_ORIGINS = "https://mebot.fly.dev"

[mounts]
  source = "mebot_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # One machine, always on: background jobs and in-memory limits assume a single process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
