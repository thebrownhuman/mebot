# mebot: one container. Quickstart:
#   curl -O https://raw.githubusercontent.com/<owner>/mebot/main/docker-compose.yml
#   docker compose up -d        # then open http://localhost:8080 and finish setup
# Data (database, secret.key, install.key) lives in ./data - back it up.
services:
  mebot:
    image: ghcr.io/${MEBOT_OWNER:-OWNER}/mebot:${MEBOT_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Ollama on the host machine (or the bundled one: --profile ollama, then set the
      # provider URL to http://ollama:11434 in Admin -> AI Provider).
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      # The container runs as uid 10001: on Linux, `sudo chown -R 10001:10001 data` once.
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ./ollama:/root/.ollama
